<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Consultants</title>
    <link rel="icon" type="image/png" href="images/Favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="main.js"> </script>
    <style>
        :root {
            --bg-card: #f2f2f2;
            --bg-input: #ffffff;
            --bg-header-table: #e6e6e6;
            --text-dark: #111111;
            --primary-pink: #e63980;
            --primary-pink-hover: #d03072;
            --border-light: #e0e0e0;
            --radius-pill: 50px;
            --radius-card: 16px;
            --radius-input: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            padding: 30px 40px;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        /* Logo Styling */
        .brand-logo img {
            height: 40px;
            width: auto;
            display: block;
            border-radius: 8px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--primary-pink);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Layout Grid */
        .view-consultants {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            align-items: start;
        }

        /* Table */
        .table-container {
            background-color: var(--bg-card);
            border-radius: var(--radius-card);
            overflow: hidden;
        }

        .custom-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .custom-table th {
            background-color: var(--bg-header-table);
            padding: 16px 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .custom-table td {
            padding: 18px 20px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-light);
        }

        .custom-table tr:last-child td {
            border-bottom: none;
        }

        .text-right {
            text-align: right;
        }

        /* Card Form */
        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-input, .form-select {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid #dcdcdc;
            border-radius: var(--radius-input);
            padding: 12px 14px;
            font-size: 0.9rem;
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary-pink);
        }

        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            cursor: pointer;
        }

      

        .btn-action:hover {
            background-color: var(--primary-pink-hover);
        }

        .btn-full {
            width: 100%;
            padding: 12px;
            text-align: center;
        }
        .close-btn{
            background-color:#f2aac6;
            color:white;
            border:none;
            padding:10px 20px;
            margin:0 5px;
            cursor:pointer;
            border-radius:5px;
            transition:all 0.3s ease;
            font-weight:bold;
        }
        .close-btn:hover{
            background-color:#e63b7c;
        }
        .notice-section{
         display:flex;
         border-radius:16px;
         justify-content:space-between;
         align-items:center;
         transition:opacity 0.4s ease, transform 0.4s ease;
        }
        .notice-section.fade-out{
            opacity:0;
            transform:translateY(-20px);
        }
        .notice{
            background:#f4f6f8;
            font-weight: 700;
            font-size: 14px;
            padding: 20px;
            border-radius:16px;
            margin-bottom: 20px;
    
        }
        
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><img src="images/DearDoctor%20logo.png" alt="DearDoctor"></div>
        <ul class="nav-links">
            <li><a href="#">Consultants</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Reports</a></li>
        </ul>
    </nav>

    <main>
        <h1 class="page-title">Consultants</h1>
         <section class="notice-section">
                <div class="notice" id="notification">
                    <span aria-placeholder="Notification bar"> A case was closed because an account was deleted.</span>
                    <button class="close-btn" id="closeNotification" >Dismiss</button>
                </div> 
            </section> 
        <div class="view-consultants">
            
            <div class="table-container"> 
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Open cases</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>[Name]</td>
                            <td>Active</td>
                            <td>[n]</td>
                            <td class="text-right">
                                <button class="nav-btn">Pause</button>
                            </td>
                        </tr>
                        <tr>
                            <td>[Name]</td>
                            <td>Paused</td>
                            <td>[n]</td>
                            <td class="text-right">
                                <button class="nav-btn">Reactivate</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h2 style="font-size: 1.05rem; margin-bottom: 18px;">Create user account</h2>
                
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select class="form-select">
                        <option>Consultant</option>
                    </select>
                </div>

                <button class="nav-btn" style="margin-top: 10px;">Send invite</button>
            </div>

        </div>
    </main>
</body>
</html>
