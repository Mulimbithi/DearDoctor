  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocBot Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-header: #dcdcdc;
            --bg-bubble: #e4e4e4;
            --bg-card: #e8e8e8;
            --text-dark: #111111;
            --text-muted: #444444;
            --btn-dark: #1c1c1c;
            --btn-secondary: #666666;
            --radius-pill: 50px;
            --radius-card: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
        }

        /* Content Body */
        .content {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Greeting */
        .greeting {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Chat Bubble */
        .chat-bubble {
            background-color: var(--bg-bubble);
            padding: 18px 20px;
            border-radius: var(--radius-card);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Check-in Card */
        .checkin-card {
            background-color: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius-card);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkin-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .checkin-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .card-actions {
            display: flex;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            flex: 1;
        }

        .btn-primary {
            background-color: var(--btn-dark);
            color: #ffffff;
        }

        .btn-secondary {
            background-color: var(--btn-secondary);
            color: #ffffff;
        }

        /* Section Label */
        .section-label {
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Topic Pills Grid */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .topic-btn {
            background-color: #e63b7c;
            color:white;
            border: none;
            padding: 14px 16px;
            border-radius:40px ;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
        }

        .topic-btn:hover, .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="images/DearDoctor%20logo.png" alt="DearDoctor Logo">  
    </div>
    <div class="app-container">
        <!-- Top Header Bar -->
        <header class="header">
            DocBot
        </header>

        <!-- Main Viewport -->
        <main class="content">
            <!-- Welcome Heading -->
            <h1 class="greeting">Welcome back, [nickname]</h1>

            <!-- Conversation Prompt Bubble -->
            <div class="chat-bubble">
                Last time we talked about [topic]. How has that been?
            </div>

            <!-- Unfinished Check-in Card -->
            <div class="checkin-card">
                <div class="checkin-title">You have an unfinished check-in</div>
                <div class="checkin-subtitle">Question [n] of 10</div>
                <div class="card-actions">
                    <button class="signin-btn">Continue</button>
                    <button class="signin-btn">Start Again</button>
                </div>
            </div>

            <!-- Topic Selection Heading -->
            <div class="section-label">Or talk about something else</div>

            <!-- Topic Pills -->
            <div class="topic-grid">
                <button class="topic-btn">Loneliness</button>
                <button class="topic-btn">Baby and sleep</button>
                <button class="topic-btn">School</button>
                <button class="topic-btn">Family</button>
            </div>
            <div class="input-group">
                <input type="text" placeholder="Enter your own topic...">
            </div>

        </main>
    </div>

</body>
</html>
