<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My cases</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/Favicon.png">
  <script src="api.js"></script>
  <script src="consultant.js" defer></script>
</head>
<body data-page="consultant" >
  <main class="container consultant-page">

    <header class="account-bar">
      <h1 class="account-title">My cases</h1>
      <div class="account-actions">
        <a class="nav-btn" href="settings.html">Settings</a>
        <button class="nav-btn" id="signout" type="button">Sign out</button>
      </div>
    </header>

    <p id="page-error" class="form-error" role="alert" hidden></p>

    <section class="case-section" aria-label="Case summary">
      <div class="case-count">
        <span class="case-label">Open</span>
        <strong class="case-value" id="open-count">&ndash;</strong>
      </div>
      <div class="case-count">
        <span class="case-label">High risk</span>
        <strong class="case-value" id="high-count">&ndash;</strong>
      </div>
    </section>
    <p id="capacity-note" class="sort-note" hidden></p>

    <section id="notices" aria-live="polite"></section>

    <nav class="filters" aria-label="Filter by risk level">
      <button class="chip chip-all active" type="button" data-filter="all"    aria-pressed="true">All</button>
      <button class="chip high-chip"       type="button" data-filter="urgent" aria-pressed="false">Urgent</button>
      <button class="chip high-chip"       type="button" data-filter="high"   aria-pressed="false">High</button>
      <button class="chip medium-chip"     type="button" data-filter="moderate" aria-pressed="false">Moderate</button>
      <button class="chip low-chip"        type="button" data-filter="low"    aria-pressed="false">Low</button>
    </nav>
    <p class="sort-note">Sorted by risk level, then by how long the case has been waiting</p>

    <ul class="cases-grid" id="case-list"></ul>
    <p id="empty-message" class="sort-note" hidden></p>

  </main>
</body>
</html>
